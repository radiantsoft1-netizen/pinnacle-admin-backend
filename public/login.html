<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pinnacle Admin Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1a2b5f;
      --yellow: #f5c518;
      --yellow-light: #ffe14d;
      --text: #4a5568;
      --text-muted: #5c6b7a;
      --border: rgba(26, 43, 95, 0.14);
      --bg-muted: #f5f6f8;
      --shadow-sm: 0 8px 24px -8px rgba(0, 51, 102, 0.18);
      --shadow-gold: 0 4px 18px rgba(245, 197, 24, 0.4);
      --radius-sm: 8px;
      --radius-lg: 16px;
      --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --font-serif: 'Fraunces', 'Georgia', serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: var(--font-sans);
      background: var(--bg-muted);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      padding: 44px 36px;
    }

    .logo-mark {
      display: block;
      height: 64px;
      width: auto;
      max-width: 100%;
      object-fit: contain;
      margin: 0 auto 24px;
    }

    .card h1 {
      font-family: var(--font-serif);
      font-size: 24px;
      font-weight: 600;
      color: var(--primary);
      text-align: center;
      margin-bottom: 6px;
    }

    .card .subtitle {
      text-align: center;
      font-size: 13.5px;
      color: var(--text-muted);
      margin-bottom: 28px;
    }

    .demo-note {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      background: var(--bg-muted);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 9px 12px;
      margin-bottom: 24px;
    }

    .demo-note code {
      font-family: 'SF Mono', 'Courier New', monospace;
      font-size: 11.5px;
      color: var(--primary);
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      color: var(--primary);
      font-weight: 600;
      margin-bottom: 7px;
      font-size: 13px;
    }

    input {
      width: 100%;
      padding: 11px 14px;
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--primary);
      font-size: 14px;
      font-family: var(--font-sans);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input::placeholder {
      color: #A0AAB8;
    }

    input:focus {
      outline: none;
      border-color: var(--yellow);
      box-shadow: 0 0 0 3px rgba(245, 197, 24, 0.18);
    }

    .button {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      padding: 13px;
      background: var(--yellow);
      color: var(--primary);
      border: 2px solid var(--yellow);
      border-radius: var(--radius-sm);
      font-family: var(--font-sans);
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.25s ease;
      margin-top: 6px;
      box-shadow: var(--shadow-gold);
    }

    .button:hover {
      border-color: var(--yellow-light);
      background: var(--yellow-light);
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(245, 197, 24, 0.5);
    }

    .button:active {
      transform: translateY(0);
    }

    .button:disabled {
      opacity: 0.7;
      cursor: default;
      transform: none;
    }

    .message {
      font-size: 13.5px;
      margin-top: 16px;
      padding: 11px 14px;
      border-radius: var(--radius-sm);
      text-align: center;
      display: none;
    }

    .error {
      color: #C0392B;
      background: #FDEEEC;
      border: 1px solid #F6D2CD;
      display: block !important;
    }

    .success {
      color: #1E8449;
      background: #EAF8EF;
      border: 1px solid #C9EDD5;
      display: block !important;
    }

    .loading {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .spinner {
      display: inline-block;
      width: 13px;
      height: 13px;
      border: 2px solid var(--primary);
      border-top: 2px solid transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .footer-note {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: #9AA5B1;
    }

    @media (max-width: 420px) {
      .card {
        padding: 34px 24px;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo-mark" src="/images/pinnacle-logo.png" alt="Pinnacle Design | Build">

    <h1>Admin Login</h1>
    <p class="subtitle">Sign in to manage your Pinnacle site</p>

    <div class="demo-note">
      Demo: <code>admin@pinnaclebuild.com</code> / <code>Pinnacle123!</code>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="admin@pinnaclebuild.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password" required autocomplete="current-password">
      </div>

      <button type="submit" class="button">
        <span class="button-text">Login</span>
        <span class="loading">
          <span class="spinner"></span>Signing in&hellip;
        </span>
      </button>

      <div id="message" class="message"></div>
    </form>

    <p class="footer-note">© 2026 Pinnacle Design &amp; Build</p>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const messageDiv = document.getElementById('message');
      const button = document.querySelector('.button');
      const buttonText = document.querySelector('.button-text');
      const loading = document.querySelector('.loading');

      // Show loading state
      button.disabled = true;
      buttonText.style.display = 'none';
      loading.style.display = 'inline-flex';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          messageDiv.className = 'message success';
          messageDiv.textContent = '✅ Login successful! Redirecting...';
          setTimeout(() => {
            window.location.href = '/dashboard.html';
          }, 1000);
        } else {
          messageDiv.className = 'message error';
          messageDiv.textContent = '❌ ' + (data.error || 'Login failed');
          button.disabled = false;
          buttonText.style.display = 'inline';
          loading.style.display = 'none';
        }
      } catch (error) {
        messageDiv.className = 'message error';
        messageDiv.textContent = '❌ Connection error. Please try again.';
        button.disabled = false;
        buttonText.style.display = 'inline';
        loading.style.display = 'none';
      }
    });

    // Auto-fill demo credentials for convenience
    document.getElementById('email').value = 'admin@pinnaclebuild.com';
  </script>
</body>
</html>
