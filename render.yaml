services:
  - type: web
    name: pinnacle-admin
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pinnacle-admin-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false

databases:
  - name: pinnacle-admin-db
    plan: free
    ipAllowList: []
