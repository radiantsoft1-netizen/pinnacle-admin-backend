<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pinnacle Admin Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #FFFFFF;
    }

    .login-container {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* LEFT SIDE - building image, fully visible, no overlay (hidden on mobile) */
    .left-side {
      display: none;
      position: relative;
      background-image: url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=1400&q=80');
      background-size: cover;
      background-position: center;
    }

    .left-overlay {
      position: absolute;
      bottom: 60px;
      left: 50px;
      right: 50px;
      color: #FFFFFF;
    }

    .left-overlay h2 {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 8px;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
    }

    .left-overlay p {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 2px;
      color: #F4C430;
      text-transform: uppercase;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
    }

    /* RIGHT SIDE - glassmorphism panel */
    .right-side {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: linear-gradient(135deg, #2C3E50 0%, #34495E 100%);
    }

    .form-wrapper {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
      padding: 30px;
      width: 100%;
      max-width: 420px;
      animation: slideUp 0.5s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo h1 {
      color: #2C3E50;
      font-size: 28px;
      margin-bottom: 5px;
      font-weight: 700;
    }

    .logo p {
      color: #F4C430;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      color: #2C3E50;
      font-weight: 500;
      margin-bottom: 8px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 8px;
      color: #2C3E50;
      font-size: 14px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      transition: all 0.3s;
    }

    input::placeholder {
      color: #8C9BA8;
    }

    input:focus {
      outline: none;
      border-color: #F4C430;
      box-shadow: 0 0 0 3px rgba(244, 196, 48, 0.1);
      background: rgba(255, 255, 255, 0.98);
    }

    .button {
      width: 100%;
      padding: 12px 24px;
      background: #F4C430;
      color: #2C3E50;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 10px;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .button:hover {
      background: #E8B820;
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(244, 196, 48, 0.3);
    }

    .button:active {
      transform: translateY(0);
    }

    .message {
      font-size: 14px;
      margin-top: 15px;
      padding: 12px 16px;
      border-radius: 8px;
      text-align: center;
      display: none;
    }

    .error {
      color: #E74C3C;
      background: rgba(231, 76, 60, 0.1);
      border: 1px solid rgba(231, 76, 60, 0.3);
      display: block !important;
    }

    .success {
      color: #27AE60;
      background: rgba(39, 174, 96, 0.1);
      border: 1px solid rgba(39, 174, 96, 0.3);
      display: block !important;
    }

    .info-box {
      background: rgba(244, 196, 48, 0.1);
      border: 1px solid rgba(244, 196, 48, 0.3);
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 24px;
      font-size: 13px;
      color: #2C3E50;
      line-height: 1.6;
    }

    .info-box strong {
      display: block;
      margin-bottom: 8px;
      color: #2C3E50;
    }

    .info-box code {
      background: rgba(255, 255, 255, 0.7);
      padding: 2px 6px;
      border-radius: 3px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
    }

    .loading {
      display: none;
      text-align: center;
      color: #2C3E50;
      font-size: 14px;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #2C3E50;
      border-top: 2px solid transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* TABLET: 768px - 1199px */
    @media (min-width: 768px) {
      .login-container {
        flex-direction: row;
        height: 100vh;
      }

      .left-side {
        display: block;
        width: 40%;
      }

      .right-side {
        width: 60%;
        background: linear-gradient(135deg, rgba(44, 62, 80, 0.3), rgba(52, 73, 94, 0.3));
      }

      .form-wrapper {
        background: rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        border-radius: 16px;
      }

      .logo h1,
      .logo p,
      label {
        color: #2C3E50;
      }
    }

    /* DESKTOP: 1200px+ */
    @media (min-width: 1200px) {
      .left-side {
        width: 50%;
      }

      .right-side {
        width: 50%;
        padding: 40px;
      }

      .form-wrapper {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(30px);
        -webkit-backdrop-filter: blur(30px);
        padding: 50px;
        max-width: 450px;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <!-- LEFT SIDE (image, fully visible) -->
    <div class="left-side">
      <div class="left-overlay">
        <h2>Pinnacle Design | Build</h2>
        <p>Admin Panel</p>
      </div>
    </div>

    <!-- RIGHT SIDE (glassmorphism form) -->
    <div class="right-side">
      <div class="form-wrapper">
        <div class="logo">
          <h1>Pinnacle</h1>
          <p>ADMIN LOGIN</p>
        </div>

        <div class="info-box">
          <strong>📝 Demo Credentials:</strong>
          Email: <code>admin@pinnaclebuild.com</code><br>
          Password: <code>Pinnacle123!</code>
        </div>

        <form id="loginForm">
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="admin@pinnaclebuild.com" required autocomplete="email">
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter password" required autocomplete="current-password">
          </div>

          <button type="submit" class="button">
            <span class="button-text">Login</span>
            <span class="loading">
              <span class="spinner"></span>Logging in...
            </span>
          </button>

          <div id="message" class="message"></div>
        </form>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const messageDiv = document.getElementById('message');
      const button = document.querySelector('.button');
      const buttonText = document.querySelector('.button-text');
      const loading = document.querySelector('.loading');

      // Show loading state
      button.disabled = true;
      buttonText.style.display = 'none';
      loading.style.display = 'inline';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          messageDiv.className = 'message success';
          messageDiv.textContent = '✅ Login successful! Redirecting...';
          setTimeout(() => {
            window.location.href = '/dashboard.html';
          }, 1000);
        } else {
          messageDiv.className = 'message error';
          messageDiv.textContent = '❌ ' + (data.error || 'Login failed');
          button.disabled = false;
          buttonText.style.display = 'inline';
          loading.style.display = 'none';
        }
      } catch (error) {
        messageDiv.className = 'message error';
        messageDiv.textContent = '❌ Connection error. Please try again.';
        button.disabled = false;
        buttonText.style.display = 'inline';
        loading.style.display = 'none';
      }
    });

    // Auto-fill demo credentials for convenience
    document.getElementById('email').value = 'admin@pinnaclebuild.com';
  </script>
</body>
</html>
