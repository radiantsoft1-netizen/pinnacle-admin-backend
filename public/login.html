<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pinnacle Admin Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1a2b5f;
      --yellow: #f5c518;
      --yellow-light: #ffe14d;
      --text: #4a5568;
      --text-muted: #5c6b7a;
      --border: rgba(26, 43, 95, 0.14);
      --shadow-gold: 0 4px 18px rgba(245, 197, 24, 0.4);
      --radius-sm: 8px;
      --radius-lg: 20px;
      --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --font-serif: 'Fraunces', 'Georgia', serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: var(--font-sans);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    .bg-photo {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(160deg, rgba(15, 23, 62, 0.88) 0%, rgba(26, 43, 95, 0.75) 45%, rgba(15, 23, 62, 0.92) 100%),
        url('https://images.unsplash.com/photo-1541888946425-d81bb19240f5?w=1920&q=80');
      background-size: cover;
      background-position: center;
      z-index: -1;
    }

    .bg-photo::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 30%, rgba(245, 197, 24, 0.08), transparent 60%);
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: var(--radius-lg);
      box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255,255,255,0.06);
      padding: 48px 40px 40px;
      animation: cardIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo-mark {
      display: block;
      height: 60px;
      width: auto;
      max-width: 100%;
      object-fit: contain;
      margin: 0 auto 22px;
    }

    .eyebrow {
      display: block;
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--yellow);
      background: var(--primary);
      -webkit-background-clip: text;
      background-clip: text;
      margin-bottom: 10px;
    }
    .eyebrow span { color: #c99a00; }

    .card h1 {
      font-family: var(--font-serif);
      font-size: 30px;
      font-weight: 600;
      color: var(--primary);
      text-align: center;
      margin-bottom: 8px;
      letter-spacing: -0.01em;
    }

    .card h1 em {
      font-style: italic;
      color: #c99a00;
    }

    .card .subtitle {
      text-align: center;
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      color: var(--primary);
      font-weight: 600;
      margin-bottom: 7px;
      font-size: 13px;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      background: #FFFFFF;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--primary);
      font-size: 14px;
      font-family: var(--font-sans);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input::placeholder {
      color: #A0AAB8;
    }

    input:focus {
      outline: none;
      border-color: var(--yellow);
      box-shadow: 0 0 0 3px rgba(245, 197, 24, 0.18);
    }

    .button {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      padding: 14px;
      background: var(--yellow);
      color: var(--primary);
      border: 2px solid var(--yellow);
      border-radius: var(--radius-sm);
      font-family: var(--font-sans);
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.25s ease;
      margin-top: 8px;
      box-shadow: var(--shadow-gold);
    }

    .button:hover {
      border-color: var(--yellow-light);
      background: var(--yellow-light);
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(245, 197, 24, 0.5);
    }

    .button:active {
      transform: translateY(0);
    }

    .button:disabled {
      opacity: 0.7;
      cursor: default;
      transform: none;
    }

    .message {
      font-size: 13.5px;
      margin-top: 16px;
      padding: 11px 14px;
      border-radius: var(--radius-sm);
      text-align: center;
      display: none;
    }

    .error {
      color: #C0392B;
      background: #FDEEEC;
      border: 1px solid #F6D2CD;
      display: block !important;
    }

    .success {
      color: #1E8449;
      background: #EAF8EF;
      border: 1px solid #C9EDD5;
      display: block !important;
    }

    .loading {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .spinner {
      display: inline-block;
      width: 13px;
      height: 13px;
      border: 2px solid var(--primary);
      border-top: 2px solid transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .footer-note {
      text-align: center;
      margin-top: 26px;
      font-size: 12px;
      color: #9AA5B1;
    }

    @media (max-width: 420px) {
      .card {
        padding: 38px 26px 32px;
      }
      .card h1 { font-size: 26px; }
    }
  </style>
</head>
<body>
  <div class="bg-photo"></div>

  <div class="card">
    <img class="logo-mark" src="/images/pinnacle-logo.png" alt="Pinnacle Design | Build">

    <p class="eyebrow">Pinnacle Design <span>|</span> Build</p>
    <h1>Admin <em>Login</em></h1>
    <p class="subtitle">Sign in to manage your site</p>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="you@pinnaclebuild.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password" required autocomplete="current-password">
      </div>

      <button type="submit" class="button">
        <span class="button-text">Login</span>
        <span class="loading">
          <span class="spinner"></span>Signing in&hellip;
        </span>
      </button>

      <div id="message" class="message"></div>
    </form>

    <p class="footer-note">© 2026 Pinnacle Design &amp; Build</p>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const messageDiv = document.getElementById('message');
      const button = document.querySelector('.button');
      const buttonText = document.querySelector('.button-text');
      const loading = document.querySelector('.loading');

      // Show loading state
      button.disabled = true;
      buttonText.style.display = 'none';
      loading.style.display = 'inline-flex';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          messageDiv.className = 'message success';
          messageDiv.textContent = '✅ Login successful! Redirecting...';
          setTimeout(() => {
            window.location.href = '/dashboard.html';
          }, 1000);
        } else {
          messageDiv.className = 'message error';
          messageDiv.textContent = '❌ ' + (data.error || 'Login failed');
          button.disabled = false;
          buttonText.style.display = 'inline';
          loading.style.display = 'none';
        }
      } catch (error) {
        messageDiv.className = 'message error';
        messageDiv.textContent = '❌ Connection error. Please try again.';
        button.disabled = false;
        buttonText.style.display = 'inline';
        loading.style.display = 'none';
      }
    });
  </script>
</body>
</html>
