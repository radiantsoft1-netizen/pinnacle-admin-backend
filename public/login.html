<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pinnacle Admin Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #FFFFFF;
    }

    .login-container {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* LEFT SIDE - branding content (hidden on mobile) */
    .left-side {
      display: none;
      background: linear-gradient(160deg, #EAF0F6 0%, #DCE8F5 100%);
      align-items: center;
      justify-content: center;
      padding: 60px 40px;
    }

    .left-content {
      max-width: 420px;
      width: 100%;
      text-align: left;
    }

    .left-content .logo {
      font-size: 32px;
      font-weight: 700;
      color: #F4C430;
      margin-bottom: 20px;
      letter-spacing: -0.01em;
    }

    .left-content h1 {
      font-size: 36px;
      font-weight: 700;
      color: #2C3E50;
      margin-bottom: 10px;
      line-height: 1.2;
    }

    .left-content p {
      font-size: 16px;
      color: #2C3E50;
      opacity: 0.7;
      margin-bottom: 40px;
      line-height: 1.5;
    }

    .illustration {
      width: 200px;
      height: 200px;
    }

    .illustration svg {
      width: 100%;
      height: 100%;
    }

    /* RIGHT SIDE - login card container */
    .right-side {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: linear-gradient(135deg, #2C3E50 0%, #34495E 100%);
    }

    .login-card {
      background: #FFFFFF;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
      padding: 40px 30px;
      width: 100%;
      max-width: 420px;
      animation: slideUp 0.5s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card-header {
      margin-bottom: 24px;
    }

    .card-header .brand-mark {
      font-size: 15px;
      font-weight: 700;
      color: #F4C430;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .card-header h2 {
      color: #2C3E50;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .card-header .subtitle {
      color: #666666;
      font-size: 14px;
    }

    .info-box {
      background: #FFF8DC;
      border-left: 4px solid #F4C430;
      color: #2C3E50;
      padding: 12px 16px;
      border-radius: 4px;
      font-size: 13px;
      margin-bottom: 24px;
      line-height: 1.6;
    }

    .info-box code {
      background: rgba(255, 255, 255, 0.7);
      padding: 2px 6px;
      border-radius: 3px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      color: #2C3E50;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 13px;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      background: #F9F9F9;
      border: 1px solid #E0E0E0;
      border-radius: 6px;
      color: #2C3E50;
      font-size: 14px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      transition: all 0.3s;
    }

    input::placeholder {
      color: #999999;
    }

    input:focus {
      outline: none;
      border-color: #F4C430;
      background: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(244, 196, 48, 0.1);
    }

    .button {
      width: 100%;
      padding: 12px 24px;
      background: #F4C430;
      color: #2C3E50;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 8px;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .button:hover {
      background: #E8B820;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(244, 196, 48, 0.25);
    }

    .button:active {
      transform: translateY(0);
    }

    .footer-text {
      color: #666666;
      font-size: 13px;
      margin-top: 16px;
      text-align: center;
    }

    .message {
      font-size: 14px;
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 6px;
      text-align: center;
      display: none;
    }

    .error {
      color: #FFFFFF;
      background: #E74C3C;
      display: block !important;
    }

    .success {
      color: #FFFFFF;
      background: #27AE60;
      display: block !important;
    }

    .loading {
      display: none;
      text-align: center;
      color: #2C3E50;
      font-size: 14px;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #2C3E50;
      border-top: 2px solid transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* TABLET: 768px - 1199px */
    @media (min-width: 768px) {
      .login-container {
        flex-direction: row;
        height: 100vh;
      }

      .left-side {
        display: flex;
        width: 40%;
      }

      .right-side {
        width: 60%;
        background: #F9F9F9;
      }

      .left-content h1 {
        font-size: 30px;
      }
    }

    /* DESKTOP: 1200px+ */
    @media (min-width: 1200px) {
      .left-side {
        width: 50%;
      }

      .right-side {
        width: 50%;
        padding: 40px;
      }

      .left-content h1 {
        font-size: 36px;
      }

      .login-card {
        padding: 50px;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <!-- LEFT SIDE (branding content) -->
    <div class="left-side">
      <div class="left-content">
        <div class="logo">Pinnacle</div>
        <h1>Admin Panel</h1>
        <p>Manage your Pinnacle projects efficiently</p>
        <div class="illustration">
          <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="100" cy="100" r="90" fill="#2C3E50" fill-opacity="0.06"/>
            <path d="M40 140L85 60L115 105L135 75L160 140H40Z" fill="#2C3E50" fill-opacity="0.85"/>
            <path d="M85 60L100 85L70 105L85 60Z" fill="#F4C430"/>
            <rect x="55" y="140" width="14" height="20" fill="#2C3E50" fill-opacity="0.5"/>
            <rect x="130" y="130" width="14" height="30" fill="#2C3E50" fill-opacity="0.5"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- RIGHT SIDE (login card) -->
    <div class="right-side">
      <div class="login-card">
        <div class="card-header">
          <div class="brand-mark">Pinnacle</div>
          <h2>Admin Login</h2>
          <p class="subtitle">Sign in to your Pinnacle Admin account</p>
        </div>

        <div class="info-box">
          Demo: <code>admin@pinnaclebuild.com</code> / <code>Pinnacle123!</code>
        </div>

        <form id="loginForm">
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="admin@pinnaclebuild.com" required autocomplete="email">
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter password" required autocomplete="current-password">
          </div>

          <button type="submit" class="button">
            <span class="button-text">Login</span>
            <span class="loading">
              <span class="spinner"></span>Logging in...
            </span>
          </button>

          <div id="message" class="message"></div>
        </form>

        <p class="footer-text">Don't have an account? Contact administrator</p>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const messageDiv = document.getElementById('message');
      const button = document.querySelector('.button');
      const buttonText = document.querySelector('.button-text');
      const loading = document.querySelector('.loading');

      // Show loading state
      button.disabled = true;
      buttonText.style.display = 'none';
      loading.style.display = 'inline';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          messageDiv.className = 'message success';
          messageDiv.textContent = '✅ Login successful! Redirecting...';
          setTimeout(() => {
            window.location.href = '/dashboard.html';
          }, 1000);
        } else {
          messageDiv.className = 'message error';
          messageDiv.textContent = '❌ ' + (data.error || 'Login failed');
          button.disabled = false;
          buttonText.style.display = 'inline';
          loading.style.display = 'none';
        }
      } catch (error) {
        messageDiv.className = 'message error';
        messageDiv.textContent = '❌ Connection error. Please try again.';
        button.disabled = false;
        buttonText.style.display = 'inline';
        loading.style.display = 'none';
      }
    });

    // Auto-fill demo credentials for convenience
    document.getElementById('email').value = 'admin@pinnaclebuild.com';
  </script>
</body>
</html>
